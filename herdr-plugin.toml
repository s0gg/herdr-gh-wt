id = "gh-wt"
name = "herdr-gh-wt"
version = "0.1.0"
# The oldest Herdr the plugin has been tested with.
min_herdr_version = "0.9.1"
description = "Dashboard of pull requests awaiting your review and issues assigned to you; open any of them as a worktrunk worktree workspace"
platforms = ["linux", "macos"]

# `--target-dir` keeps the binary where the commands below expect it, even
# when CARGO_TARGET_DIR points elsewhere.
[[build]]
command = ["cargo", "build", "--release", "--locked", "--target-dir", "target"]

[[actions]]
id = "dashboard"
title = "GitHub: review requests & assigned issues"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-gh-wt\" launch"]

# Opened by the action above with the placement and size from config.toml.
[[panes]]
id = "dashboard"
title = "GitHub review requests & assigned issues"
placement = "popup"
width = "90%"
height = "90%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-gh-wt\" dashboard"]
