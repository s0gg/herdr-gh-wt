[package]
name = "herdr-gh-wt"
version = "0.1.0"
edition = "2024"
description = "Herdr plugin: a dashboard of GitHub review requests and assigned issues that opens them as worktrunk worktrees"
license = "MIT OR Apache-2.0"
repository = "https://github.com/s0gg/herdr-gh-wt"

[dependencies]
anyhow = "1.0.105"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"
