[package]
name = "herdr-gh-wt"
version = "0.1.0"
edition = "2024"
# Checked by the msrv job in .github/workflows/ci.yml.
rust-version = "1.88"
description = "Herdr plugin: a dashboard of GitHub review requests and assigned issues that opens them as worktrunk worktrees"
license = "MIT OR Apache-2.0"
repository = "https://github.com/s0gg/herdr-gh-wt"

[dependencies]
anyhow = "1.0.105"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# API documentation and attribute suggestions aimed at published libraries;
# the library half of this crate only serves its own binary.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Rendering functions lay out whole screens.
too_many_lines = "allow"
# Leftovers from test-first development must not reach main.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Outside tests, handle errors instead of panicking (see clippy.toml).
unwrap_used = "warn"
